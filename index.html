<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <title>水豚噜噜</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app" aria-label="水豚噜噜桌面宠物">
      <div id="speech" class="speech" role="status" aria-live="polite">
        <span id="speechText">今天也一起慢慢来吧～</span>
      </div>

      <section id="petStage" class="pet-stage idle" aria-label="拖动噜噜可以移动位置">
        <nav class="quick-actions" aria-label="噜噜快捷互动">
          <button class="round-button quick-action" data-slot="0" type="button">♥</button>
          <button class="round-button quick-action" data-slot="1" type="button">🥕</button>
          <button class="round-button quick-action" data-slot="2" type="button">☾</button>
        </nav>
        <div id="effects" class="effects" aria-hidden="true"></div>
        <div id="sleepMarks" class="sleep-marks" aria-hidden="true">
          <span>z</span><span>Z</span><span>Z</span>
        </div>
        <img id="lulu" class="lulu" src="assets/lulu-idle.png" alt="戴着小橘子、穿着橙红短裤的水豚噜噜" draggable="false" />
        <div class="soft-shadow" aria-hidden="true"></div>
        <div class="name-tag" aria-hidden="true"><span class="online-dot"></span>噜噜</div>
      </section>
    </main>
    <script src="interactions.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
